# SupaMeal — full local stack: Mongo + API + web frontend
#
# Usage:
#   cp .env.docker.example .env   (fill in real values)
#   docker compose up --build
#
# Frontend:  http://localhost:8080
# API:       http://localhost:3000

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    # Not published to the host by default — only the API talks to it.
    # To inspect from your machine, uncomment:
    # ports:
    #   - "27017:27017"

  api:
    build:
      context: ./SPML_backend/supameal_backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGO_URI: mongodb://mongo:27017/supameal
      # ── Required: set these in .env before running ──
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (32+ chars)}
      JWT_REFRESH: ${JWT_REFRESH:?Set JWT_REFRESH in .env (32+ chars)}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:5173}
      # ── Optional integrations ──
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_CURRENCY: ${STRIPE_CURRENCY:-usd}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      FROM_EMAIL: ${FROM_EMAIL:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-http://localhost:3000/auth/google/callback}
      THROTTLE_TTL_MS: ${THROTTLE_TTL_MS:-60000}
      THROTTLE_LIMIT: ${THROTTLE_LIMIT:-100}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      UPLOAD_DIR: /app/uploads
    volumes:
      # Uploaded restaurant/menu images must survive container rebuilds
      - uploads_data:/app/uploads
    depends_on:
      - mongo

  web:
    build:
      context: ./supameal-frontend
      args:
        # Baked into the bundle at build time — must be reachable from the browser
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  mongo_data:
  uploads_data:
